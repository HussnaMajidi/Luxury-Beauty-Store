<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glow & Sparkle — Premium Makeup, Skincare & Haircare</title>
    <meta name="description" content="Discover premium cosmetics, skincare, and haircare products at Glow & Sparkle. Reveal your natural beauty with our luxurious collection." />
    <meta name="keywords" content="cosmetics, skincare, haircare, makeup, beauty, premium beauty products" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; min-height: 100vh; }
      html.light, html.light body { background-color: #fff9fb !important; color: #1a1a1a; }
      html.dark, html.dark body { background-color: #1a1a1a !important; color: #ffffff; }
      @keyframes sparkle-float {
        0%, 100% { transform: translateY(0) rotate(0deg); opacity: 1; }
        50% { transform: translateY(-20px) rotate(180deg); opacity: 0.5; }
      }
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      .animate-fade-in-up { animation: fade-in-up 0.6s ease-out forwards; }
      .animate-shimmer {
        background: linear-gradient(90deg, transparent, rgba(255,182,193,0.4), transparent);
        background-size: 200% 100%;
        animation: shimmer 3s infinite;
      }
    </style>
    <script>
      (function() {
        const saved = localStorage.getItem('glow-theme');
        const theme = saved || 'light';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
